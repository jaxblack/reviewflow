name: CI

# Keep the full gate for pull requests and main. The production bundle includes
# public/docs, so documentation portal changes must be built and smoke-tested too.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reviewflow_test
          POSTGRES_USER: reviewflow
          POSTGRES_PASSWORD: reviewflow-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reviewflow -d reviewflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://reviewflow:reviewflow-ci-password@127.0.0.1:5432/reviewflow_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

  container:
    name: Build and smoke-test container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reviewflow_container
          POSTGRES_USER: reviewflow
          POSTGRES_PASSWORD: reviewflow-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reviewflow -d reviewflow_container"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build image
        run: docker build --tag reviewflow:ci .

      - name: Start container
        run: |
          docker run --detach \
            --name reviewflow-ci \
            --network host \
            --env HOST=127.0.0.1 \
            --env DATABASE_URL=postgres://reviewflow:reviewflow-ci-password@127.0.0.1:5432/reviewflow_container \
            --env SESSION_SECRET=ci-only-session-secret-at-least-32-bytes \
            reviewflow:ci

      - name: Verify health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs reviewflow-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm --force reviewflow-ci
