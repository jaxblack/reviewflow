services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reviewflow
      POSTGRES_USER: reviewflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewflow -d reviewflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - reviewflow-postgres:/var/lib/postgresql/data

  reviewflow:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://reviewflow:${POSTGRES_PASSWORD}@postgres:5432/reviewflow
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_PATH: ${COOKIE_PATH:-/reviewflow}
      REVIEWFLOW_WRITE_RATE_LIMIT: ${REVIEWFLOW_WRITE_RATE_LIMIT:-30}
      REVIEWFLOW_MAX_USERS: ${REVIEWFLOW_MAX_USERS:-100}
      REVIEWFLOW_MAX_CONTENTS: ${REVIEWFLOW_MAX_CONTENTS:-500}
      REVIEWFLOW_MAX_ROUNDS_PER_CONTENT: ${REVIEWFLOW_MAX_ROUNDS_PER_CONTENT:-20}
      REVIEWFLOW_MAX_IDEMPOTENCY_RECORDS: ${REVIEWFLOW_MAX_IDEMPOTENCY_RECORDS:-2000}
      REVIEWFLOW_IDEMPOTENCY_TTL_HOURS: ${REVIEWFLOW_IDEMPOTENCY_TTL_HOURS:-24}
    ports:
      - "127.0.0.1:${REVIEWFLOW_PORT:-3000}:3000"

volumes:
  reviewflow-postgres: